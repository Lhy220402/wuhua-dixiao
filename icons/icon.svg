<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 《物化帝笑传》网站图标：物化帝（皇帝形象）半身像。
       纯手写矢量，无外部图片；配色取自 src/config/theme.ts。 -->
  <rect width="512" height="512" fill="#0B1114"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="#123329"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#C9A227" stroke-width="6" opacity="0.85"/>

  <!-- 背后的粉笔圆 -->
  <circle cx="256" cy="286" r="176" fill="none" stroke="#F2EEE3" stroke-width="4" opacity="0.14"/>
  <circle cx="256" cy="286" r="150" fill="#1E3029"/>

  <!-- 激光“凝视”射线（先画，压在眼镜下面） -->
  <g stroke="#FF3B30" stroke-linecap="round" opacity="0.55">
    <line x1="218" y1="250" x2="44" y2="176" stroke-width="7"/>
    <line x1="294" y1="250" x2="468" y2="176" stroke-width="7"/>
  </g>
  <g fill="#FF3B30" opacity="0.35">
    <circle cx="44" cy="176" r="14"/>
    <circle cx="468" cy="176" r="14"/>
  </g>

  <!-- 龙袍肩部 -->
  <path d="M86 512 L86 452 Q86 388 150 366 L206 348 L306 348 L362 366 Q426 388 426 452 L426 512 Z"
        fill="#C9A227" stroke="#0B1114" stroke-width="10" stroke-linejoin="round"/>
  <path d="M120 512 L120 456 Q120 414 158 398" fill="none" stroke="#9A7B12" stroke-width="9" opacity="0.9"/>
  <path d="M392 512 L392 456 Q392 414 354 398" fill="none" stroke="#9A7B12" stroke-width="9" opacity="0.9"/>
  <!-- 玉带 -->
  <rect x="128" y="470" width="256" height="34" rx="10" fill="#3E8E7E" stroke="#0B1114" stroke-width="8"/>
  <circle cx="256" cy="487" r="9" fill="#F2EEE3" opacity="0.9"/>
  <!-- 红色领口 -->
  <path d="M186 350 L256 420 L326 350 L306 340 L256 386 L206 340 Z"
        fill="#6B1E2E" stroke="#0B1114" stroke-width="8" stroke-linejoin="round"/>

  <!-- 脖子 -->
  <rect x="228" y="300" width="56" height="56" rx="18" fill="#F2C9A0" stroke="#0B1114" stroke-width="9"/>

  <!-- 头发 / 头部 -->
  <circle cx="256" cy="214" r="118" fill="#141B22"/>
  <circle cx="256" cy="236" r="108" fill="#F2C9A0" stroke="#0B1114" stroke-width="10"/>
  <!-- 鬓角 -->
  <path d="M150 210 Q142 256 158 292 Q170 264 170 226 Z" fill="#141B22"/>
  <path d="M362 210 Q370 256 354 292 Q342 264 342 226 Z" fill="#141B22"/>
  <!-- 呆毛 -->
  <path d="M300 122 L318 88 L326 112 L350 76" fill="none" stroke="#141B22" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 冕冠：底座 + 冠体 + 玉珠 -->
  <rect x="142" y="132" width="228" height="34" rx="8" fill="#E0B341" stroke="#0B1114" stroke-width="9"/>
  <rect x="198" y="82" width="116" height="56" rx="8" fill="#C9A227" stroke="#0B1114" stroke-width="9"/>
  <rect x="216" y="96" width="80" height="12" rx="6" fill="#6B1E2E"/>
  <g stroke="#E0B341" stroke-width="6" stroke-linecap="round">
    <line x1="170" y1="166" x2="170" y2="196"/>
    <line x1="208" y1="166" x2="208" y2="196"/>
    <line x1="256" y1="166" x2="256" y2="196"/>
    <line x1="304" y1="166" x2="304" y2="196"/>
    <line x1="342" y1="166" x2="342" y2="196"/>
  </g>
  <g fill="#3E8E7E" stroke="#0B1114" stroke-width="4">
    <circle cx="170" cy="202" r="8"/>
    <circle cx="208" cy="202" r="8"/>
    <circle cx="256" cy="202" r="8"/>
    <circle cx="304" cy="202" r="8"/>
    <circle cx="342" cy="202" r="8"/>
  </g>

  <!-- 圆框眼镜 -->
  <g fill="#F7F3E7" stroke="#0B1114" stroke-width="9">
    <circle cx="214" cy="256" r="40"/>
    <circle cx="298" cy="256" r="40"/>
  </g>
  <line x1="254" y1="256" x2="258" y2="256" stroke="#0B1114" stroke-width="9"/>
  <line x1="174" y1="250" x2="146" y2="242" stroke="#0B1114" stroke-width="9" stroke-linecap="round"/>
  <line x1="338" y1="250" x2="366" y2="242" stroke="#0B1114" stroke-width="9" stroke-linecap="round"/>
  <!-- 眼睛 -->
  <circle cx="220" cy="258" r="9" fill="#141B22"/>
  <circle cx="304" cy="258" r="9" fill="#141B22"/>
  <circle cx="223" cy="255" r="3" fill="#FFFFFF"/>
  <circle cx="307" cy="255" r="3" fill="#FFFFFF"/>

  <!-- 眉 / 鼻 / 嘴（一本正经） -->
  <line x1="196" y1="222" x2="232" y2="218" stroke="#141B22" stroke-width="7" stroke-linecap="round"/>
  <line x1="280" y1="218" x2="316" y2="222" stroke="#141B22" stroke-width="7" stroke-linecap="round"/>
  <line x1="256" y1="266" x2="250" y2="288" stroke="#0B1114" stroke-width="5" stroke-linecap="round"/>
  <path d="M226 312 Q256 326 286 312" fill="none" stroke="#0B1114" stroke-width="7" stroke-linecap="round"/>
  <!-- 脸颊 -->
  <circle cx="186" cy="292" r="12" fill="#E5484D" opacity="0.22"/>
  <circle cx="326" cy="292" r="12" fill="#E5484D" opacity="0.22"/>
</svg>
