  <head>

    <meta

    />
    <meta name="theme-color" content="#0B1114" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="物化帝笑传" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="《物化帝笑传》—— iwanna 式校园梗平台跳跃 Boss 战" />
    <link

      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230B1114'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23E0B341' stroke='%230B1114' stroke-width='4'/%3E%3Ctext x='32' y='41' font-size='24' text-anchor='middle' font-family='sans-serif' font-weight='700' fill='%230B1114'%3E帝%3C/text%3E%3C/svg%3E"

  <body>
    <div id="app">
      <div id="stage" aria-hidden="true">
        <canvas id="game-canvas"></canvas>
      </div>
      <div id="ui-root"></div>
      <div id="rotate-hint" class="rotate-hint hidden" role="dialog" aria-modal="true">
        <div class="rotate-card">
          <div class="rotate-glyph">▭</div>
          <h1>把手机横过来</h1>
          <p>礼堂才装得下。</p>
          <div class="rotate-actions">
            <button id="rotate-fullscreen" class="btn btn-secondary" type="button">进入全屏</button>
            <button id="rotate-continue" class="btn btn-ghost" type="button">仍然继续</button>
          </div>
        </div>
      </div>
      <div id="boot-screen" class="boot-screen">
        <div class="boot-mark">物化帝笑传</div>
        <div class="boot-sub">正在开灯……</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
